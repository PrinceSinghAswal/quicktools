<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickTools</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
    }

    header p {
      margin-top: 8px;
      color: #cbd5e1;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .tool {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    .tool h2 {
      margin-bottom: 10px;
    }

    .tool p {
      color: #666;
      margin-bottom: 18px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>QuickTools</h1>
    <p>Simple tools, all in one place</p>
  </header>

  <div class="container">

    <div class="tools">

      <div class="tool">
        <h2>Calculator</h2>
        <p>Quickly calculate numbers.</p>
        <button onclick="alert('Calculator coming soon!')">
          Open
        </button>
      </div>

      <div class="tool">
        <h2>Text Counter</h2>
        <p>Count words and characters.</p>
        <button onclick="alert('Text Counter coming soon!')">
          Open
        </button>
      </div>

      <div class="tool">
        <h2>Password Generator</h2>
        <p>Generate a random password.</p>
        <button onclick="generatePassword()">
          Generate
        </button>
      </div>

      <div class="tool">
        <h2>QR Generator</h2>
        <p>Create QR codes easily.</p>
        <button onclick="alert('QR Generator coming soon!')">
          Open
        </button>
      </div>

    </div>

  </div>

  <footer>
    © 2026 QuickTools
  </footer>

  <script>
    function generatePassword() {
      const chars =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%";

      let password = "";

      for (let i = 0; i < 12; i++) {
        password += chars[Math.floor(Math.random() * chars.length)];
      }

      alert("Your password: " + password);
    }
  </script>

</body>
</html>
